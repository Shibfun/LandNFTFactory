<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiba NFT Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff9100;
            --secondary-color: #ff6f61;
            --gradient-bg: linear-gradient(180deg, #1e1e2f 0%, #2a2a3d 100%);
            --card-bg: #2c2f48;
            --input-bg: #373b5c;
            --text-color: #ffffff;
            --border-radius: 15px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--gradient-bg);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 20px;
        }
        .header {
            background: linear-gradient(90deg, var(--secondary-color) 0%, var(--primary-color) 100%);
            padding: 12px;
            border-radius: var(--border-radius);
            text-align: center;
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .input-box {
            background: var(--input-bg);
            padding: 15px;
            border-radius: var(--border-radius);
            margin-bottom: 15px;
        }
        .input-box label {
            display: block;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            background: var(--input-bg);
            border: none;
            border-radius: 10px;
            color: var(--text-color);
            font-size: 1em;
        }
        .action-button {
            padding: 15px;
            background: var(--primary-color);
            color: var(--text-color);
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
            margin-bottom: 10px;
        }
        .action-button:hover { background: #e68a00; }
        .action-button:disabled {
            background: #4a4f7a;
            cursor: not-allowed;
        }
        .status {
            margin-top: 10px;
            font-size: 0.9em;
            color: var(--primary-color);
            text-align: center;
        }
        .map-container {
            width: 100%;
            max-width: 800px;
            height: 600px;
            overflow: hidden;
            border-radius: var(--border-radius);
            background: #1C2526;
            position: relative;
        }
        #mapCanvas {
            width: 100%;
            height: 100%;
        }
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            font-size: 1.2em;
        }
        .instructions {
            margin-top: 10px;
            font-size: 0.8em;
            color: #cccccc;
            text-align: center;
        }
        .dog-section {
            text-align: center;
            margin-top: 20px;
        }
        .dog-section img {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
        }
        .dog-message {
            font-size: 0.9em;
            color: var(--secondary-color);
            font-style: italic;
        }
        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .header { font-size: 1.1em; }
            .map-container { height: 400px; }
            .dog-section img { width: 50px; height: 50px; }
            .dog-message { font-size: 0.8em; }
            .instructions { font-size: 0.7em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Shiba NFT Map - View Minted Plots</div>
        <div class="input-box">
            <label for="nftContractAddress">NFT Contract Address</label>
            <input type="text" id="nftContractAddress" placeholder="e.g., 0x...">
        </div>
        <button class="action-button" id="queryButton">Query Map</button>
        <div id="networkStatus" class="status">Enter contract address and click "Query Map"...</div>
        <div class="map-container">
            <canvas id="mapCanvas"></canvas>
            <div id="loadingOverlay" class="loading-overlay">Loading...</div>
        </div>
        <div class="instructions">Use mouse wheel to zoom, click and drag to pan, hover to see coordinates, click to show position</div>
    </div>
    <div class="dog-section">
        <img src="https://raw.githubusercontent.com/Shibfun/ChainBridge/refs/heads/main/images/shiba.gif" alt="Shiba Dog">
        <div class="dog-message" id="dogMessage">Woof! Enter the NFT contract address and click "Query Map" to view minted plots!</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <script>
        const nftAbi = [
            {
                inputs: [{ internalType: "uint256", name: "", type: "uint256" }],
                name: "coordinateByTokenId",
                outputs: [{ internalType: "uint256", name: "", type: "uint256" }],
                stateMutability: "view",
                type: "function"
            },
            {
                inputs: [],
                name: "totalSupply",
                outputs: [{ internalType: "uint256", name: "", type: "uint256" }],
                stateMutability: "view",
                type: "function"
            }
        ];

        const shibariumRpc = 'https://www.shibrpc.com';
        let web3 = new Web3(shibariumRpc);
        let nftContract;
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const loadingOverlay = document.getElementById('loadingOverlay');
        let scale = 0.5;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let startX, startY;
        let lastMintedCoordinates = [];
        let lastHoveredCoord = null;
        let lastStatusMessage = "Enter contract address and click \"Query Map\"...";

        const dogMessages = {
            invalidContract: ["Woof! Invalid NFT contract address, please check!"],
            noMinted: ["Woof! This contract has no minted NFTs!"],
            querySuccess: ["Woof! Map loaded successfully, minted plots are orange!"],
            queryFail: ["Woof! Query failed, please check the contract address or network!"],
            invalidAddress: ["Woof! Please enter a valid contract address!"],
            emptyAddress: ["Woof! Contract address cannot be empty!"],
            timeout: ["Woof! Network request timed out, please try again!"]
        };

        function getRandomMessage(type) {
            const messages = dogMessages[type];
            return messages[Math.floor(Math.random() * messages.length)];
        }

        function withTimeout(promise, timeoutMs) {
            return Promise.race([
                promise,
                new Promise((_, reject) => setTimeout(() => reject(new Error('Request timed out')), timeoutMs))
            ]);
        }

        async function updateMap() {
            const contractAddress = document.getElementById('nftContractAddress').value.trim();
            const status = document.getElementById('networkStatus');
            const dogMessage = document.getElementById('dogMessage');
            const queryButton = document.getElementById('queryButton');

            if (!contractAddress) {
                status.innerText = "Please enter a contract address";
                dogMessage.innerText = getRandomMessage('emptyAddress');
                drawMap([]);
                return;
            }

            if (!web3.utils.isAddress(contractAddress)) {
                status.innerText = "Please enter a valid contract address";
                dogMessage.innerText = getRandomMessage('invalidAddress');
                drawMap([]);
                return;
            }

            queryButton.disabled = true;
            status.innerText = "Querying map...";
            dogMessage.innerText = "Woof! Fetching minted plots...";
            loadingOverlay.style.display = "flex";

            try {
                nftContract = new web3.eth.Contract(nftAbi, contractAddress);
                let totalSupply;
                for (let attempt = 1; attempt <= 3; attempt++) {
                    try {
                        totalSupply = await withTimeout(nftContract.methods.totalSupply().call(), 5000);
                        break;
                    } catch (error) {
                        if (attempt === 3) throw new Error(`Failed to fetch totalSupply: ${error.message}`);
                        await new Promise(resolve => setTimeout(resolve, 2000));
                    }
                }

                const totalSupplyNum = parseInt(totalSupply);
                if (totalSupplyNum === 0) {
                    lastStatusMessage = "No NFTs minted in this contract";
                    status.innerText = lastStatusMessage;
                    dogMessage.innerText = getRandomMessage('noMinted');
                    lastMintedCoordinates = [];
                    drawMap([]);
                    loadingOverlay.style.display = "none";
                    queryButton.disabled = false;
                    return;
                }

                let mintedCoordinates = [];
                const batchSize = 20;
                for (let i = 1; i <= totalSupplyNum; i += batchSize) {
                    let promises = [];
                    for (let j = i; j < i + batchSize && j <= totalSupplyNum; j++) {
                        promises.push(
                            (async () => {
                                for (let attempt = 1; attempt <= 3; attempt++) {
                                    try {
                                        const coord = await withTimeout(nftContract.methods.coordinateByTokenId(j).call(), 5000);
                                        return { tokenId: j, coord: parseInt(coord) };
                                    } catch (error) {
                                        if (attempt === 3) throw error;
                                        await new Promise(resolve => setTimeout(resolve, 2000));
                                    }
                                }
                            })()
                        );
                    }
                    const batchResults = await Promise.all(promises);
                    mintedCoordinates.push(...batchResults);
                    status.innerText = `Querying map... (${mintedCoordinates.length}/${totalSupplyNum} plots fetched)`;
                }

                lastMintedCoordinates = mintedCoordinates;
                drawMap(mintedCoordinates);
                lastStatusMessage = `Map loaded (${mintedCoordinates.length} plots minted)`;
                status.innerText = lastStatusMessage;
                dogMessage.innerText = getRandomMessage('querySuccess');
            } catch (error) {
                if (error.message.includes('timed out')) {
                    lastStatusMessage = "Network request timed out";
                    status.innerText = lastStatusMessage;
                    dogMessage.innerText = getRandomMessage('timeout');
                } else {
                    lastStatusMessage = "Query failed";
                    status.innerText = lastStatusMessage;
                    dogMessage.innerText = getRandomMessage('queryFail');
                }
                lastMintedCoordinates = [];
                drawMap([]);
            } finally {
                loadingOverlay.style.display = "none";
                queryButton.disabled = false;
            }
        }

        function drawMap(mintedCoordinates) {
            const gridSize = 1000;
            const pixelSize = 1 * scale;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            for (let x = 0; x < gridSize; x++) {
                for (let y = 0; y < gridSize; y++) {
                    const coord = x * 1000 + y;
                    const isMinted = mintedCoordinates.some(item => item.coord === coord);
                    ctx.fillStyle = isMinted ? '#ff9100' : '#555555';
                    ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
                }
            }

            ctx.strokeStyle = '#E0E0E0';
            ctx.lineWidth = Math.max(0.1, 0.2 * scale);
            ctx.beginPath();
            for (let x = 0; x <= gridSize; x++) {
                ctx.moveTo(x * pixelSize, 0);
                ctx.lineTo(x * pixelSize, gridSize * pixelSize);
            }
            for (let y = 0; y <= gridSize; y++) {
                ctx.moveTo(0, y * pixelSize);
                ctx.lineTo(gridSize * pixelSize, y * pixelSize);
            }
            ctx.stroke();

            if (scale > 2) {
                ctx.fillStyle = '#E0E0E0';
                ctx.font = `${Math.min(8 / scale, 4)}px Poppins`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const visibleXStart = Math.max(0, Math.floor(-offsetX / scale));
                const visibleXEnd = Math.min(gridSize, Math.ceil((-offsetX + canvas.width) / scale));
                const visibleYStart = Math.max(0, Math.floor(-offsetY / scale));
                const visibleYEnd = Math.min(gridSize, Math.ceil((-offsetY + canvas.height) / scale));
                for (let x = visibleXStart; x < visibleXEnd; x++) {
                    for (let y = visibleYStart; y < visibleYEnd; y++) {
                        ctx.fillText(
                            `(${x},${y})`,
                            x * pixelSize + pixelSize / 2,
                            y * pixelSize + pixelSize / 2
                        );
                    }
                }
            }

            if (lastHoveredCoord) {
                const { x, y, tokenId } = lastHoveredCoord;
                const isMinted = mintedCoordinates.some(item => item.coord === x * 1000 + y);
                if (isMinted) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
 CTX.fillRect(x * pixelSize, y * pixelSize - 30, 120, 25);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '12px Poppins';
                    ctx.fillText(`(${x}, ${y}) ID: ${tokenId}`, x * pixelSize + 5, y * pixelSize - 15);
                }
            }

            ctx.restore();
        }

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomSpeed = 0.1;
            const oldScale = scale;
            scale = Math.max(0.1, scale * (e.deltaY > 0 ? 1 - zoomSpeed : 1 + zoomSpeed));
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            offsetX = mouseX - (mouseX - offsetX) * (scale / oldScale);
            offsetY = mouseY - (mouseY - offsetY) * (scale / oldScale);
            drawMap(lastMintedCoordinates);
        });

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left - offsetX) / scale;
            const mouseY = (e.clientY - rect.top - offsetY) / scale;
            const gridX = Math.floor(mouseX);
            const gridY = Math.floor(mouseY);
            if (gridX >= 0 && gridX < 1000 && gridY >= 0 && gridY < 1000) {
                const coord = gridX * 1000 + gridY;
                const mintedItem = lastMintedCoordinates.find(item => item.coord === coord);
                lastHoveredCoord = mintedItem ? { x: gridX, y: gridY, tokenId: mintedItem.tokenId } : null;
            } else {
                lastHoveredCoord = null;
            }
            if (isDragging) {
                offsetX = e.clientX - startX;
                offsetY = e.clientY - startY;
            }
            drawMap(lastMintedCoordinates);
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            lastHoveredCoord = null;
            drawMap(lastMintedCoordinates);
        });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left - offsetX) / scale;
            const mouseY = (e.clientY - rect.top - offsetY) / scale;
            const gridX = Math.floor(mouseX);
            const gridY = Math.floor(mouseY);
            if (gridX >= 0 && gridX < 1000 && gridY >= 0 && gridY < 1000) {
                const coord = gridX * 1000 + gridY;
                const mintedItem = lastMintedCoordinates.find(item => item.coord === coord);
                if (mintedItem) {
                    document.getElementById('networkStatus').innerText = `Token ID: ${mintedItem.tokenId} at (${gridX}, ${gridY})`;
                } else {
                    document.getElementById('networkStatus').innerText = lastStatusMessage;
                }
            }
        });

        document.getElementById('queryButton').addEventListener('click', async () => {
            await updateMap();
        });

        drawMap([]);
    </script>
</body>
</html>
